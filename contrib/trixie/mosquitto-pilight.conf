# /etc/mosquitto/conf.d/pilight.conf
#
# OPTIONAL. pilight's own broker speaks MQTT 3.1, 3.1.1 and 5, so this is
# only needed if you want Mosquitto features such as authentication.
#
# Mosquitto serves clients on 1883 and bridges the pilight topics to the
# pilight broker. pilight then needs in /etc/pilight/config.json, "settings":
#     "mqtt-port": 1885

listener 1883
allow_anonymous true

connection pilight
address 127.0.0.1:1885
bridge_protocol_version mqttv311
cleansession true
notifications false
# control commands to pilight, states and system values from pilight
topic pilight/dev/ctrl/# out 0
topic pilight/dev/stat/# in 0
topic pilight/sys/# in 0
